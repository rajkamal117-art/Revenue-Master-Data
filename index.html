<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>Revenue Hub · InitiateFirst</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Install as an app (Android / iPhone / desktop) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#EEE2F5">
  <link rel="icon" type="image/png" href="favicon-64.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revenue Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<!-- Shared SVG filter that gives every icon shape its soft clay shading -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="clay" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="-2" dy="-3" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/>
      <feGaussianBlur in="e1" stdDeviation="1.8" result="b1"/>
      <feFlood flood-color="#3b2f6b" flood-opacity=".20"/>
      <feComposite in2="b1" operator="in" result="shade"/>
      <feOffset in="SourceAlpha" dx="2" dy="2.5" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/>
      <feGaussianBlur in="e2" stdDeviation="1.5" result="b2"/>
      <feFlood flood-color="#ffffff" flood-opacity=".8"/>
      <feComposite in2="b2" operator="in" result="light"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
      <feComposite in="m" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
</svg>

  <!-- ============ LOGIN ============ -->
  <div class="login" id="login" hidden>
    <form class="clay login-card" id="loginForm" autocomplete="on">
      <div class="login-icons">
        <span class="clay-ico lg" data-icon="chart"></span>
        <span class="clay-ico xl" data-icon="dashboard"></span>
        <span class="clay-ico lg" data-icon="lock"></span>
      </div>
      <h1>Revenue Hub</h1>
      <p>Sign in to continue</p>
      <input class="input" type="email" id="loginEmail" placeholder="you@company.com" required autocomplete="username">
      <input class="input" type="password" id="loginPass" placeholder="Password" required autocomplete="current-password">
      <div class="login-err" id="loginErr"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
    </form>
  </div>

  <div class="app" id="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="clay-ico tone-blue lg" data-icon="dashboard"></span>
        <div>
          <div class="brand-name" id="brandName">Revenue Hub</div>
          <div class="brand-sub" id="brandSub">InitiateFirst</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button class="nav-item" data-route="audit"><span class="clay-ico sm tone-lavender" data-icon="gear"></span><span>Activity log</span></button>
        <a class="nav-item" id="sheetLink" target="_blank" rel="noopener"><span class="clay-ico sm tone-mint" data-icon="cloud"></span><span>Open sheet</span></a>
        <button class="nav-item" id="installBtn" hidden><span class="clay-ico sm" data-icon="cloud"></span><span>Install app</span></button>
        <button class="nav-item" id="logoutBtn"><span class="clay-ico sm" data-icon="send"></span><span>Sign out</span></button>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <div class="greet">
          <div class="greet-hi" id="greetHi">Hello 👋</div>
          <div class="greet-title" id="pageTitle">Dashboard</div>
        </div>
        <label class="search-pill">
          <span class="clay-ico xs tone-lavender" data-icon="search"></span>
          <input id="globalSearch" placeholder="Search people, clients, POs…" autocomplete="off">
        </label>
        <button class="bell" id="bellBtn" aria-label="Alerts">
          <span class="clay-ico md tone-pink" data-icon="bell"></span>
          <span class="bell-badge" id="bellBadge" hidden>0</span>
        </button>
        <div class="avatar" id="avatar" title=""><span class="clay-ico md tone-blue" data-icon="user"></span></div>
      </header>

      <section class="view" id="view">
        <div class="loader"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
      </section>
    </main>
  </div>

  <!-- Drawer for record view / edit -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <!-- Alerts popover -->
  <div class="popover clay" id="alertPop" hidden></div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    /* ---- Install as app ---- */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    let deferredInstall = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); deferredInstall = e;
      document.getElementById('installBtn').hidden = false;
    });
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredInstall) {
        deferredInstall.prompt();
        await deferredInstall.userChoice; deferredInstall = null;
        document.getElementById('installBtn').hidden = true;
      }
    });
    window.addEventListener('appinstalled', () => { document.getElementById('installBtn').hidden = true; });
  </script>
</body>
</html>
